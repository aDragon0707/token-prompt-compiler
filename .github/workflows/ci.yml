name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Show runtime
        run: |
          node --version
          npm --version

      - name: Syntax check scripts
        run: |
          node --check scripts/run-api-ab-test.mjs
          node --check scripts/run-claude-local-ab-test.mjs
          node --check scripts/tpc.mjs
          node --check scripts/phase1-smoke.mjs
          node --check scripts/benchmark-smoke.mjs
          node --check scripts/validate-json.mjs
          node --check scripts/schema-smoke.mjs
          node --check scripts/skill-chain-smoke.mjs
          node --check scripts/skill-trigger-cases-smoke.mjs
          node --check scripts/eval-roadmap-smoke.mjs
          node --check scripts/eval-smoke.mjs
          node --check scripts/judge-smoke.mjs
          node --check scripts/provider-smoke.mjs
          node --check scripts/run-skill-effect-eval.mjs
          node --check scripts/judge-skill-effect-eval.mjs

      - name: Run smoke harness
        run: npm run smoke

      - name: Run JSON schema smoke harness
        run: npm run schema:smoke

      - name: Run benchmark smoke harness
        run: npm run benchmark:smoke

      - name: Run skill chain smoke harness
        run: npm run skill:smoke

      - name: Run skill trigger case smoke harness
        run: npm run skill:cases

      - name: Run eval roadmap smoke harness
        run: npm run eval:roadmap

      - name: Run eval smoke harness
        run: npm run eval:smoke

      - name: Run judge smoke harness
        run: npm run eval:judge:smoke

      - name: Run repository validation
        run: npm run validate
